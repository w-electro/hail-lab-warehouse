<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RuLab">
<meta name="theme-color" content="#1F4B43">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='7' fill='%231F4B43'/%3E%3Ctext x='6' y='12' font-family='monospace' font-size='6' fill='white' opacity='0.55'%3E44%3C/text%3E%3Ctext x='20' y='26' font-family='Arial,sans-serif' font-size='17' font-weight='700' fill='white' text-anchor='middle'%3ERu%3C/text%3E%3Ctext x='20' y='35' font-family='monospace' font-size='5' letter-spacing='1' fill='white' opacity='0.55' text-anchor='middle'%3ELAB%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%231F4B43'/%3E%3Ctext x='6' y='12' font-family='monospace' font-size='6' fill='white' opacity='0.55'%3E44%3C/text%3E%3Ctext x='20' y='26' font-family='Arial,sans-serif' font-size='17' font-weight='700' fill='white' text-anchor='middle'%3ERu%3C/text%3E%3Ctext x='20' y='35' font-family='monospace' font-size='5' letter-spacing='1' fill='white' opacity='0.55' text-anchor='middle'%3ELAB%3C/text%3E%3C/svg%3E">
<title>RuLab — نظام مخزون المختبر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAEDE6; --surface:#FBFBF6; --ink:#17211D; --ink-dim:#5C6A63;
    --line:rgba(23,33,29,0.13); --line-strong:rgba(23,33,29,0.26);
    --brand:#1F4B43; --brand-dim:rgba(31,75,67,0.10);
    --amber:#C97C2B; --amber-dim:rgba(201,124,43,0.12);
    --red:#B33A3A; --red-bg:#FBEAEA;
    --yellow:#B8930C; --yellow-bg:#FBF6DE;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans Arabic',sans-serif;line-height:1.6;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  header{position:relative;padding:16px 20px 18px;background:rgba(255,255,255,.55);}
  header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--accent, var(--brand));transition:background .4s ease;}
  .hdr-inner{max-width:1140px;margin:0 auto;}

  .brand-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .tile{position:relative;width:42px;height:42px;border-radius:8px;background:var(--brand);overflow:hidden;flex:none;box-shadow:0 3px 8px rgba(31,75,67,.32);}
  .tile-liquid{position:absolute;left:0;right:0;bottom:0;height:0%;background:linear-gradient(180deg, rgba(201,124,43,.5), rgba(201,124,43,.85));}
  .tile-num{position:absolute;top:3px;inset-inline-start:5px;font-family:'IBM Plex Mono',monospace;font-size:8px;color:rgba(255,255,255,.6);}
  .tile-sym{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#fff;letter-spacing:-.5px;}
  .tile-cap{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:6px;letter-spacing:1.5px;color:rgba(255,255,255,.55);}
  @media (prefers-reduced-motion: no-preference){
    .tile-liquid{animation:fillUp 1.1s cubic-bezier(.22,1,.36,1) .2s forwards;}
  }
  @media (prefers-reduced-motion: reduce){
    .tile-liquid{height:58%;}
  }
  @keyframes fillUp{ from{height:0%;} to{height:58%;} }

  .wordmark{line-height:1.25;}
  .word{font-size:19px;font-weight:700;letter-spacing:-.2px;}
  .word-ru{color:var(--amber);}
  .word-lab{color:var(--ink);}
  .word-sub{font-size:11.5px;color:var(--ink-dim);margin-top:1px;}

  .dept-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch;}
  .dept-chip{display:flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid var(--line-strong);background:#fff;border-radius:20px;padding:7px 14px;font-size:13px;color:var(--ink-dim);flex:none;transition:background .22s ease, color .22s ease, border-color .22s ease, transform .15s ease;}
  .dept-chip:active{transform:scale(.96);}
  .dept-chip .dot{width:8px;height:8px;border-radius:50%;flex:none;transition:background .22s ease;}
  .dept-chip.active{background:var(--dept-color,var(--brand));color:#fff;border-color:var(--dept-color,var(--brand));}
  .dept-chip.active .dot{background:#fff;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px;}
  .tabs{position:relative;display:flex;gap:4px;background:#fff;border:1px solid var(--line-strong);border-radius:9px;padding:3px;}
  .tab-indicator{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:6px;background:var(--brand);transition:transform .32s cubic-bezier(.65,0,.35,1), width .32s cubic-bezier(.65,0,.35,1);z-index:0;}
  .tab{position:relative;z-index:1;border:none;background:none;padding:8px 18px;border-radius:6px;font-size:14px;color:var(--ink-dim);font-weight:600;transition:color .25s ease;}
  .tab.active{color:#fff;}
  .search{flex:1;min-width:140px;}
  .search input{width:100%;padding:9px 12px;border:1px solid var(--line-strong);border-radius:8px;font-family:inherit;font-size:14px;background:#fff;transition:border-color .2s ease;}
  .search input:focus-visible{border-color:var(--amber);}
  .btn-add{background:var(--amber);color:#fff;border:none;padding:9px 18px;border-radius:8px;font-size:14px;font-weight:600;flex:none;white-space:nowrap;transition:transform .15s ease, box-shadow .2s ease;}
  .btn-add:hover{box-shadow:0 4px 10px var(--amber-dim);transform:translateY(-1px);}
  .btn-add:active{transform:translateY(0) scale(.97);}

  .alert-strip{max-width:1140px;margin:14px auto 0;padding:0 20px;position:relative;}
  .alert-row{display:flex;gap:10px;align-items:stretch;}
  .notif-wrap{position:relative;flex:1;}
  .btn-notif{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;font-size:14px;font-weight:600;color:var(--ink);transition:transform .15s ease, box-shadow .2s ease;}
  .btn-notif:hover{box-shadow:0 4px 10px rgba(23,33,29,.08);transform:translateY(-1px);}
  .notif-badge{background:var(--red);color:#fff;font-size:11px;padding:1px 8px;border-radius:20px;line-height:1.5;}
  .notif-panel{position:absolute;top:calc(100% + 8px);right:0;left:0;background:#fff;border:1px solid var(--line-strong);border-radius:8px;padding:12px 14px;max-height:380px;overflow-y:auto;z-index:40;box-shadow:0 10px 24px rgba(20,25,25,.14);
    opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-6px);transition:opacity .2s ease, transform .2s ease, visibility .2s;}
  .notif-panel.show{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0);}
  .notif-dept{margin-bottom:14px;}
  .notif-dept:last-child{margin-bottom:0;}
  .notif-dept-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:6px;}
  .notif-dept-title .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .notif-item-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;padding:6px 0;border-top:1px solid var(--line);}
  .notif-empty{font-size:13px;color:var(--ink-dim);text-align:center;padding:18px 0;}

  main{max-width:1140px;margin:0 auto;padding:18px 20px 80px;}
  #status-msg{font-size:12.5px;color:var(--ink-dim);min-height:20px;margin-bottom:6px;opacity:0;transform:translateY(-4px);transition:opacity .25s ease, transform .25s ease;}
  #status-msg.show{opacity:1;transform:translateY(0);}
  .current-dept-label{font-size:13px;color:var(--ink-dim);margin-bottom:10px;}
  .current-dept-label b{color:var(--ink);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;box-shadow:0 1px 3px rgba(23,33,29,.07);
    opacity:0;transform:translateY(10px);animation:cardIn .4s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(var(--i,0) * 40ms);}
  @media (prefers-reduced-motion: reduce){ .card{opacity:1;transform:none;animation:none;} }
  @keyframes cardIn{ from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
  .card-cap{height:7px;background:var(--dept-color,var(--brand));}
  .card-photo{width:100%;height:70px;background:#E7E9E0 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.55;}
  .card-body{padding:9px 10px 10px;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;flex-wrap:wrap;}
  .card-name{font-size:13.5px;font-weight:600;margin:0;}
  .card-lot{font-size:10px;color:var(--ink-dim);margin-top:2px;}
  .tag{position:absolute;top:7px;inset-inline-end:0;font-size:9.5px;font-weight:700;letter-spacing:.1px;color:#fff;padding:4px 10px;border-start-end-radius:0;border-end-start-radius:10px;border-start-start-radius:10px;border-end-end-radius:0;}
  .tag.orange{background:var(--red);}
  .tag.expiry{background:var(--yellow);}
  .card-exp{font-size:10.5px;color:var(--ink-dim);margin-top:6px;}
  .qty-row{display:flex;align-items:center;gap:6px;margin-top:9px;}
  .qty-btn{width:27px;height:27px;border-radius:6px;border:1px solid var(--line-strong);background:#fff;font-size:14px;line-height:1;transition:transform .12s ease, background .2s ease;}
  .qty-btn:hover{background:var(--brand-dim);}
  .qty-btn:active{transform:scale(.88);}
  .qty-val{flex:1;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;border:1px solid var(--line-strong);border-radius:6px;padding:4px 0;background:#fff;}
  .qty-val.pulse{animation:pulseVal .35s ease;}
  @keyframes pulseVal{ 0%{transform:scale(1);} 45%{transform:scale(1.18);color:var(--amber);} 100%{transform:scale(1);} }
  .card-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;}
  .icon-btn{background:none;border:none;color:var(--ink-dim);font-size:11px;text-decoration:underline;padding:2px;transition:color .15s ease;}
  .icon-btn:hover{color:var(--ink);}
  .icon-btn.danger{color:var(--red);}

  .empty{color:var(--ink-dim);font-size:14px;padding:40px 0;text-align:center;animation:fadeIn .3s ease;}
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

  .overlay{position:fixed;inset:0;background:rgba(20,25,25,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s ease, visibility .22s;}
  .overlay.show{opacity:1;visibility:visible;pointer-events:auto;}

  .lightbox{position:fixed;inset:0;background:rgba(10,14,12,.84);display:flex;align-items:center;justify-content:center;padding:24px;z-index:60;
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s ease, visibility .22s;}
  .lightbox.show{opacity:1;visibility:visible;pointer-events:auto;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.4);
    transform:scale(.94);transition:transform .3s cubic-bezier(.34,1.4,.64,1);}
  .lightbox.show img{transform:scale(1);}
  .lightbox-close{position:absolute;top:16px;inset-inline-end:18px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:18px;line-height:1;}
  .lightbox-close:hover{background:rgba(255,255,255,.28);}
  .modal{background:#fff;border-radius:12px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto;padding:22px;
    transform:scale(.94) translateY(8px);opacity:0;transition:transform .3s cubic-bezier(.34,1.4,.64,1), opacity .22s ease;}
  .overlay.show .modal{transform:scale(1) translateY(0);opacity:1;}
  .modal h2{font-size:18px;margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--ink-dim);margin-bottom:5px;}
  .field input, .field select{width:100%;padding:9px 10px;border:1px solid var(--line-strong);border-radius:6px;font-family:inherit;font-size:14px;background:#fff;transition:border-color .2s ease;}
  .field input:focus-visible, .field select:focus-visible{border-color:var(--amber);}
  .photo-input-row{display:flex;align-items:center;gap:12px;}
  .photo-preview{width:64px;height:64px;border-radius:6px;background:#eee center/cover no-repeat;flex:none;border:1px solid var(--line-strong);}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .btn{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line-strong);background:#fff;font-size:14px;font-weight:600;transition:transform .15s ease, box-shadow .2s ease;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--amber);color:#fff;border-color:var(--amber);}
  .btn.primary:hover{box-shadow:0 4px 10px var(--amber-dim);}
  .btn.ghost{color:var(--ink-dim);}

  @media (max-width:600px){
    .toolbar{flex-direction:column;align-items:stretch;}
    .tabs{justify-content:center;}
    .btn-notif, .btn-add{padding:9px 10px;font-size:13px;}
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  }
</style>
</head>
<body>

<header>
  <div class="hdr-inner">
    <div class="brand-row">
      <div class="tile" id="brandTile">
        <span class="tile-liquid" aria-hidden="true"></span>
        <span class="tile-num">44</span>
        <span class="tile-sym">Ru</span>
        <span class="tile-cap">LAB</span>
      </div>
      <div class="wordmark">
        <div class="word"><span class="word-ru">Ru</span><span class="word-lab">Lab</span></div>
        <div class="word-sub">نظام مخزون المختبر</div>
      </div>
    </div>
    <div class="dept-row" id="deptRow"></div>
    <div class="toolbar">
      <div class="tabs" id="tabs">
        <span class="tab-indicator" id="tabIndicator"></span>
        <button class="tab active" data-type="reagents">محاليل (Reagents)</button>
        <button class="tab" data-type="equipment">أدوات (Equipment)</button>
      </div>
      <div class="search"><input id="searchInput" type="text" placeholder="بحث بالاسم أو رقم اللوت..."></div>
    </div>
  </div>
</header>

<div class="alert-strip">
  <div class="alert-row">
    <div class="notif-wrap">
      <button class="btn-notif" id="notifBtn">🔔 تنبيهات<span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
      <div class="notif-panel" id="notifPanel"></div>
    </div>
    <button class="btn-add" id="openAdd">+ إضافة غرض</button>
  </div>
</div>

<main>
  <div id="status-msg"></div>
  <div class="current-dept-label" id="deptLabel"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">إضافة غرض جديد</h2>
    <div class="field">
      <label>صورة الغرض</label>
      <div class="photo-input-row">
        <div class="photo-preview" id="photoPreview"></div>
        <input type="file" accept="image/*" capture="environment" id="photoInput">
      </div>
    </div>
    <div class="field">
      <label>القسم</label>
      <select id="fDept"></select>
    </div>
    <div class="field">
      <label>النوع</label>
      <select id="fType">
        <option value="reagents">محاليل (Reagents)</option>
        <option value="equipment">أدوات (Equipment)</option>
      </select>
    </div>
    <div class="field">
      <label>اسم الغرض</label>
      <input type="text" id="fName" placeholder="مثال: كاشف جلوكوز">
    </div>
    <div class="field">
      <label>رقم اللوت (Lot Number)</label>
      <input type="text" id="fLot" placeholder="مثال: LOT-2026-014">
    </div>
    <div class="field">
      <label>الكمية الحالية</label>
      <input type="number" id="fQty" min="0" value="0">
    </div>
    <div class="field">
      <label>حد التنبيه (يصفر عند هذا العدد أو أقل)</label>
      <input type="number" id="fThreshold" min="0" value="5">
    </div>
    <div class="field">
      <label>تاريخ الانتهاء (اختياري)</label>
      <input type="date" id="fExpiry">
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="cancelBtn">إلغاء</button>
      <button class="btn primary" id="saveBtn">حفظ</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">✕</button>
  <img id="lightboxImg" alt="صورة الغرض">
</div>

<script>
const STORAGE_KEY = 'inventory-data';
let items = [];
let activeDept = 'chemistry';
let activeType = 'reagents';
let editingId = null;
let pendingPhoto = null;
let confirmingDeleteId = null;

const DEPARTMENTS = [
  {id:'chemistry',    name:'Chemistry',      color:'#C99A2E'},
  {id:'hormone',      name:'Hormone',        color:'#8B6BA8'},
  {id:'bloodbank',    name:'Blood Bank',     color:'#D65C7D'},
  {id:'hematology',   name:'Hematology',     color:'#7A2E4D'},
  {id:'virology',     name:'Virology',       color:'#A8353A'},
  {id:'serology',     name:'Serology',       color:'#4A90A4'},
  {id:'microbiology', name:'Microbiology',   color:'#3E8368'},
  {id:'parasitology', name:'Parasitology',   color:'#8B5E3C'},
];

const grid = document.getElementById('grid');
const statusMsg = document.getElementById('status-msg');
const overlay = document.getElementById('overlay');
const searchInput = document.getElementById('searchInput');
const deptRow = document.getElementById('deptRow');
const deptLabel = document.getElementById('deptLabel');
const headerEl = document.querySelector('header');

function deptById(id){ return DEPARTMENTS.find(d=>d.id===id); }

// بيانات مشتركة سحابيًا عبر ملف data.json داخل مستودع GitHub نفسه:
// - القراءة عامة للجميع (بدون توكن) عبر raw.githubusercontent.com.
// - الإضافة/التعديل تتطلب توكن كتابة محدود بهذا المستودع فقط، يُمرَّر عبر #token= في الرابط
//   ثم يُحفظ في localStorage على هذا الجهاز ويُزال من شريط العنوان. من يملك هذا التوكن
//   يقدر يشارك الرابط (بالتوكن) مع غيره ليقدروا يضيفون هم أيضًا.
const GH_OWNER = 'w-electro';
const GH_REPO = 'hail-lab-warehouse';
const GH_FILE = 'data.json';
const RAW_URL = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/main/${GH_FILE}`;
const API_URL = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`;

let ghToken = null;
let fileSha = null;
let cloudReady = false;

(function bootstrapToken(){
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  const fromLink = hash.get('token');
  if(fromLink){
    localStorage.setItem('gh_token', fromLink);
    const url = new URL(location.href);
    url.hash = '';
    history.replaceState(null, '', url);
  }
  ghToken = localStorage.getItem('gh_token');
})();

function utf8ToBase64(str){
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
function base64ToUtf8(b64){
  const binary = atob(b64.replace(/\n/g,''));
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function setStatus(msg, isErr){
  statusMsg.textContent = msg || '';
  statusMsg.style.color = isErr ? 'var(--red)' : 'var(--ink-dim)';
  statusMsg.classList.toggle('show', !!msg);
  if(msg) setTimeout(()=>{
    if(statusMsg.textContent===msg){
      statusMsg.classList.remove('show');
      setTimeout(()=>{ if(!statusMsg.classList.contains('show')) statusMsg.textContent=''; }, 250);
    }
  }, 3000);
}

async function fetchViaApi(){
  const res = await fetch(API_URL, {
    headers: ghToken ? {'Authorization':'Bearer '+ghToken, 'Accept':'application/vnd.github+json'} : {'Accept':'application/vnd.github+json'}
  });
  if(!res.ok) throw new Error('api fetch failed: '+res.status);
  const json = await res.json();
  fileSha = json.sha;
  return JSON.parse(base64ToUtf8(json.content));
}

async function fetchViaRaw(){
  const res = await fetch(`${RAW_URL}?t=${Date.now()}`);
  if(!res.ok) throw new Error('raw fetch failed: '+res.status);
  return await res.json();
}

async function loadItems(){
  setStatus('جارِ تحميل بيانات المخزن...');
  try{
    const data = ghToken ? await fetchViaApi() : await fetchViaRaw();
    items = Array.isArray(data.items) ? data.items : [];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    cloudReady = true;
    setStatus(ghToken ? '' : 'وضع القراءة فقط — لا تملك صلاحية إضافة على هذا الجهاز', false);
  }catch(e){
    const raw = localStorage.getItem(STORAGE_KEY);
    items = raw ? JSON.parse(raw) : [];
    setStatus('تعذّر الاتصال بالمخزن السحابي — تُعرض آخر نسخة محفوظة', true);
  }
  render();
  startPolling();
}

async function saveItems(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  if(!ghToken) return;
  try{
    if(!fileSha) await fetchViaApi();
    const res = await fetch(API_URL, {
      method:'PUT',
      headers:{'Authorization':'Bearer '+ghToken, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'},
      body: JSON.stringify({
        message: 'Update inventory',
        content: utf8ToBase64(JSON.stringify({items})),
        sha: fileSha
      })
    });
    if(res.status===409){
      await fetchViaApi();
      return saveItems();
    }
    if(!res.ok) throw new Error('save failed: '+res.status);
    const json = await res.json();
    fileSha = json.content.sha;
  }catch(e){
    setStatus('تعذّر رفع التحديث للسحابة، حاول مرة أخرى', true);
  }
}

let pollTimer = null;
function startPolling(){
  if(pollTimer || !cloudReady) return;
  pollTimer = setInterval(async ()=>{
    if(document.hidden || confirmingDeleteId) return;
    try{
      const data = ghToken ? await fetchViaApi() : await fetchViaRaw();
      const fresh = JSON.stringify(Array.isArray(data.items) ? data.items : []);
      if(fresh !== JSON.stringify(items)){
        items = JSON.parse(fresh);
        localStorage.setItem(STORAGE_KEY, fresh);
        render();
      }
    }catch(e){ /* transient — next tick retries */ }
  }, 6000);
}

function daysUntil(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  return Math.round((d-today)/(1000*60*60*24));
}

function getStatus(item){
  if(item.expiry){
    const dd = daysUntil(item.expiry);
    if(dd < 0) return {level:'expiry', label:'منتهي الصلاحية'};
    if(dd <= 14) return {level:'expiry', label:`ينتهي خلال ${dd} يوم`};
  }
  const th = item.threshold ?? 5;
  if(item.quantity <= 0) return {level:'orange', label:'نفدت الكمية — اطلب الآن'};
  if(item.quantity <= th) return {level:'orange', label:'الكمية منخفضة — يلزم الطلب'};
  return {level:'normal', label:null};
}

function renderDeptRow(){
  deptRow.innerHTML = DEPARTMENTS.map(d=>{
    const count = items.filter(it=>it.department===d.id).length;
    return `<button class="dept-chip ${d.id===activeDept?'active':''}" data-dept="${d.id}" style="--dept-color:${d.color}">
      <span class="dot" style="background:${d.color}"></span>${d.name}${count?` (${count})`:''}
    </button>`;
  }).join('');
  deptRow.querySelectorAll('.dept-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{ activeDept = chip.dataset.dept; render(); });
  });
}

function render(){
  renderDeptRow();
  const dept = deptById(activeDept);
  headerEl.style.setProperty('--accent', dept.color);
  deptLabel.innerHTML = `قسم <b>${dept.name}</b> — ${activeType==='reagents' ? 'المحاليل' : 'الأدوات'}`;

  const q = searchInput.value.trim().toLowerCase();
  const filtered = items.filter(it =>
    it.department === activeDept &&
    it.type === activeType &&
    (!q || it.name.toLowerCase().includes(q) || (it.lot||'').toLowerCase().includes(q))
  );

  renderNotifPanel();

  if(filtered.length===0){
    grid.innerHTML = `<div class="empty">لا توجد أغراض في هذا القسم بعد. اضغط "إضافة غرض" للبدء.</div>`;
    return;
  }

  grid.innerHTML = filtered.map((it,idx)=>{
    const s = getStatus(it);
    return `
    <div class="card" data-id="${it.id}" style="--dept-color:${dept.color};--i:${idx}">
      ${s.label ? `<span class="tag ${s.level}">${s.label}</span>` : ''}
      <div class="card-cap"></div>
      <div class="card-photo" data-act="${it.photo ? 'view-photo' : ''}" style="${it.photo ? `background-image:url('${it.photo}');cursor:pointer` : ''}">${it.photo?'':'🧪'}</div>
      <div class="card-body">
        <div class="card-top">
          <div>
            <p class="card-name">${escapeHtml(it.name)}</p>
            <div class="card-lot mono">${it.lot ? 'اللوت: '+escapeHtml(it.lot) : 'بدون رقم لوت'}</div>
          </div>
        </div>
        ${it.expiry ? `<div class="card-exp">تاريخ الانتهاء: ${it.expiry}</div>` : ''}
        <div class="qty-row">
          <button class="qty-btn" data-act="dec">−</button>
          <div class="qty-val">${it.quantity}</div>
          <button class="qty-btn" data-act="inc">+</button>
        </div>
        <div class="card-actions">
          ${it.id===confirmingDeleteId
            ? `<button class="icon-btn" data-act="cancel-del">إلغاء</button><button class="icon-btn danger" data-act="confirm-del">تأكيد الحذف</button>`
            : `<button class="icon-btn" data-act="edit">تعديل</button><button class="icon-btn danger" data-act="del">حذف</button>`
          }
        </div>
      </div>
    </div>`;
  }).join('');

  positionTabIndicator();
}

function pulseQty(id){
  const el = grid.querySelector(`.card[data-id="${id}"] .qty-val`);
  if(!el) return;
  el.classList.remove('pulse');
  void el.offsetWidth;
  el.classList.add('pulse');
}

function positionTabIndicator(){
  const tabs = document.getElementById('tabs');
  const indicator = document.getElementById('tabIndicator');
  const active = tabs.querySelector('.tab.active');
  if(!active) return;
  const tabsRect = tabs.getBoundingClientRect();
  const activeRect = active.getBoundingClientRect();
  indicator.style.width = activeRect.width + 'px';
  indicator.style.transform = `translateX(${activeRect.left - tabsRect.left}px)`;
}

function renderNotifPanel(){
  const panel = document.getElementById('notifPanel');
  const badge = document.getElementById('notifBadge');
  const dept = deptById(activeDept);
  const deptAlerts = items
    .filter(it=>it.department===activeDept)
    .map(it=>({it, s:getStatus(it)}))
    .filter(x=>x.s.level!=='normal');

  const typeLabel = t => t==='reagents' ? 'محلول' : 'أداة';
  panel.innerHTML = `
    <div class="notif-dept">
      <div class="notif-dept-title"><span class="dot" style="background:${dept.color}"></span>${dept.name}</div>
      ${deptAlerts.length===0
        ? `<div class="notif-empty">لا توجد تنبيهات في قسم ${dept.name} حاليًا</div>`
        : deptAlerts.map(a=>`<div class="notif-item-row"><span>${escapeHtml(a.it.name)} <span style="color:var(--ink-dim)">(${typeLabel(a.it.type)})</span></span><span class="badge" style="color:${a.s.level==='expiry'?'var(--yellow)':'var(--red)'};font-weight:700;font-size:10px;">${a.s.label}</span></div>`).join('')
      }
    </div>`;
  if(deptAlerts.length>0){ badge.style.display='inline-block'; badge.textContent = deptAlerts.length; }
  else{ badge.style.display='none'; }
}

document.getElementById('notifBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  document.getElementById('notifPanel').classList.toggle('show');
});
document.addEventListener('click', (e)=>{
  const wrap = document.querySelector('.notif-wrap');
  if(wrap && !wrap.contains(e.target)) document.getElementById('notifPanel').classList.remove('show');
});

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

grid.addEventListener('click', async (e)=>{
  const card = e.target.closest('.card');
  if(!card) return;
  const id = card.dataset.id;
  const item = items.find(i=>i.id===id);
  const act = e.target.dataset.act;
  if(act==='view-photo'){ openLightbox(item.photo); }
  else if(act==='inc'){ item.quantity++; render(); pulseQty(id); await saveItems(); }
  else if(act==='dec'){ item.quantity = Math.max(0, item.quantity-1); render(); pulseQty(id); await saveItems(); }
  else if(act==='del'){
    confirmingDeleteId = id;
    render();
  } else if(act==='cancel-del'){
    confirmingDeleteId = null;
    render();
  } else if(act==='confirm-del'){
    items = items.filter(i=>i.id!==id);
    confirmingDeleteId = null;
    render();
    await saveItems();
  } else if(act==='edit'){
    openModal(item);
  }
});

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    activeType = t.dataset.type;
    positionTabIndicator();
    render();
  });
});
searchInput.addEventListener('input', render);
window.addEventListener('resize', positionTabIndicator);

document.getElementById('openAdd').addEventListener('click', ()=> openModal(null));
document.getElementById('cancelBtn').addEventListener('click', closeModal);

const fDeptSelect = document.getElementById('fDept');
fDeptSelect.innerHTML = DEPARTMENTS.map(d=>`<option value="${d.id}">${d.name}</option>`).join('');

function openModal(item){
  editingId = item ? item.id : null;
  pendingPhoto = item ? item.photo : null;
  document.getElementById('modalTitle').textContent = item ? 'تعديل الغرض' : 'إضافة غرض جديد';
  document.getElementById('fDept').value = item ? item.department : activeDept;
  document.getElementById('fType').value = item ? item.type : activeType;
  document.getElementById('fName').value = item ? item.name : '';
  document.getElementById('fLot').value = item ? item.lot : '';
  document.getElementById('fQty').value = item ? item.quantity : 0;
  document.getElementById('fThreshold').value = item ? (item.threshold ?? 5) : 5;
  document.getElementById('fExpiry').value = item ? (item.expiry||'') : '';
  const preview = document.getElementById('photoPreview');
  preview.style.backgroundImage = pendingPhoto ? `url('${pendingPhoto}')` : '';
  preview.style.backgroundSize = 'cover';
  document.getElementById('photoInput').value = '';
  overlay.classList.add('show');
}
function closeModal(){ overlay.classList.remove('show'); }

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
function openLightbox(src){
  lightboxImg.src = src;
  lightbox.classList.add('show');
}
function closeLightbox(){ lightbox.classList.remove('show'); }
document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e)=>{ if(e.target===lightbox) closeLightbox(); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeLightbox(); });

document.getElementById('photoInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    pendingPhoto = await resizeImage(file);
    const preview = document.getElementById('photoPreview');
    preview.style.backgroundImage = `url('${pendingPhoto}')`;
    preview.style.backgroundSize = 'cover';
  }catch(err){
    setStatus('تعذّر تحميل الصورة', true);
  }
});

function resizeImage(file, maxDim=400){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxDim){ h=h*maxDim/w; w=maxDim; }
        else if(h>maxDim){ w=w*maxDim/h; h=maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('fName').value.trim();
  if(!name){ setStatus('اكتب اسم الغرض أولاً', true); return; }
  const data = {
    department: document.getElementById('fDept').value,
    type: document.getElementById('fType').value,
    name,
    lot: document.getElementById('fLot').value.trim(),
    quantity: parseInt(document.getElementById('fQty').value)||0,
    threshold: parseInt(document.getElementById('fThreshold').value)||0,
    expiry: document.getElementById('fExpiry').value || null,
    photo: pendingPhoto
  };
  if(editingId){
    const idx = items.findIndex(i=>i.id===editingId);
    items[idx] = {...items[idx], ...data};
  }else{
    data.id = 'item_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    items.push(data);
  }
  activeDept = data.department;
  activeType = data.type;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.type===activeType));
  closeModal();
  render();
  await saveItems();
});

loadItems();
window.addEventListener('load', positionTabIndicator);
</script>
</body>
